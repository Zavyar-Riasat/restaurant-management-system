<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(92vw, 620px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 42px 32px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }

      .icon {
        width: 70px;
        height: 70px;
        border: 3px solid var(--text);
        border-radius: 14px;
        margin: 0 auto 24px;
        position: relative;
        opacity: 0.75;
      }

      .icon::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        border: 3px solid var(--text);
        border-top: 0;
        border-left: 0;
        transform: translate(-50%, -50%) rotate(45deg);
        border-radius: 2px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.6;
      }

      .status {
        margin-top: 24px;
        letter-spacing: 0.12em;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true"></div>
      <h1>Offline mode</h1>
      <p>
        The app is offline right now. Your saved data is still available locally,
        and the last synced information will be restored when you reconnect.
      </p>
      <div class="status">OFFLINE</div>
    </div>
  </body>
</html>
